name: Deploy Murmurworld to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
    secrets:
      MURMURWORLD_OWNER_ROUTE:
        required: false
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: Extract the site template
        run: python3 -m zipfile -e murmurworld-source.zip site
      - name: Install published company filings and fund holdings
        run: |
          mkdir -p site/public/data/company-reports
          cp public/data/company-reports/*.json site/public/data/company-reports/
          cp public/data/etf-holdings.json site/src/site/etf-holdings.json
      - name: Add the latest article files
        shell: bash
        run: |
          shopt -s nullglob
          for template in site/src/articles/{home-decor,outside,companies,funds}/*.{ko,en}.md \
                          site/src/articles/{companies,funds}/*/*.{ko,en}.md; do
            source="${template#site/}"
            test -f "$source"
            cp -- "$source" "$template"
          done
      - name: Refresh headline dates and publishers
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ "$TRIGGER" = "push" ]; then
            python3 site/scripts/refresh-market-news.py --site site --published-cache --cache-only
          else
            python3 site/scripts/refresh-market-news.py --site site --published-cache
          fi
      - uses: withastro/action@v6
        env:
          MURMURWORLD_OWNER_ROUTE: ${{ secrets.MURMURWORLD_OWNER_ROUTE }}
          PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        with:
          path: site
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
