name: Deploy Murmurworld to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Extract the site template
        run: python3 -m zipfile -e murmurworld-source.zip site
      - name: Add the latest article files
        shell: bash
        run: |
          for template in site/src/articles/{home-decor,outside,companies}/*.{ko,en}.md; do
            source="${template#site/}"
            test -f "$source"
            cp -- "$source" "$template"
          done
      - uses: withastro/action@v6
        env:
          PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        with:
          path: site
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
