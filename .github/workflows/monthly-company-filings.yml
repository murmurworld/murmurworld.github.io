name: Monthly public company filings

on:
  schedule:
    - cron: '43 0 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monthly-company-filings.yml'
      - 'scripts/filings/**'
      - 'scripts/funds/**'

permissions: {}
concurrency:
  group: monthly-company-filings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Install the filing parser
        run: |
          python3 -m pip install 'lxml==6.0.2' 'playwright==1.60.0' 'pypdf==6.14.2' 'openpyxl==3.1.5'
          python3 -m playwright install --with-deps chromium --only-shell
      - name: Test filing periods, units, and source identification
        run: python3 -m unittest discover -s scripts/filings -p 'test_*.py'
      - name: Test fund holdings, rankings, and disclosure dates
        run: python3 -m unittest discover -s scripts/funds -p 'test_*.py'
      - name: Read filings and issuer financial statements
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python3 scripts/filings/refresh.py --sec-bulk
      - name: Read complete holdings from the three fund issuers
        run: python3 scripts/funds/refresh_holdings.py
      - name: Publish verified company and fund data
        id: commit
        run: |
          git add -- public/data/company-reports public/data/etf-holdings.json public/data/etf-holdings-history
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Refresh company filings and fund holdings"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: refresh
    if: needs.refresh.outputs.revision != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      revision: ${{ needs.refresh.outputs.revision }}
    secrets:
      MURMURWORLD_OWNER_ROUTE: ${{ secrets.MURMURWORLD_OWNER_ROUTE }}
